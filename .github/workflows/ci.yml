name: Test dashboard
on:
  push:
  pull_request:
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile app.py auth.py p17lib.py prepare_data.py train_models.py build_analysis.py compare_models.py download_official_datasets.py audit_downloaded_sources.py normalize_official_datasets.py tests/smoke_test.py tests/test_normalize_official_datasets.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python tests/smoke_test.py
